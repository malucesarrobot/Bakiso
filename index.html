// ─── GRÁFICO SVG ──────────────────────────────────────────────────────────────
function BarChart({data,activeMonth}){
  const maxV=Math.max(...data.map(d=>Math.max(d.arr||0,d.prev||0,(d.arr||0)+(d.ab||0))),500);
  const H=160,PW=40,GAP=6,W=data.length*(PW+GAP);
  return(
    <svg viewBox={`0 0 ${W} ${H+24}`} style={{width:"100%",height:"auto",display:"block"}}>
      {data.map((d,i)=>{
        const x=i*(PW+GAP);
        const arrH=Math.max((d.arr/maxV)*H,0);
        const prevH=Math.max((d.prev/maxV)*H,0);
        const abH=Math.max((d.ab/maxV)*H,0);
        const act=i+1===activeMonth;
        return(
          <g key={i}>
            {d.prev>0&&<rect x={x} y={H-prevH} width={PW} height={prevH} fill={C.ocre+"33"} rx={3}/>}
            {d.ab>0&&<rect x={x} y={H-arrH-abH} width={PW} height={abH} fill={C.terra+"55"} rx={3}/>}
            {d.arr>0&&<rect x={x} y={H-arrH} width={PW} height={arrH} fill={act?C.dour:C.terra} rx={3}/>}
            <text x={x+PW/2} y={H+16} textAnchor="middle" fontSize={10} fill={act?C.terra:C.inkFade} fontWeight={act?"bold":"normal"}>{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// ─── MODAL MEMBRO ─────────────────────────────────────────────────────────────
function ModalMembro({mb,pays,toggle,onClose}){
  const gp=m=>pays[mb.id]?.[m]??null;
  const mpg=MC.filter((_,i)=>gp(i+1)!==null).length;
  const tot=MC.reduce((s,_,i)=>s+(gp(i+1)?mb.taxa:0),0);
  const esp=mb.taxa*12;
  const pct=Math.round((tot/esp)*100);

  const setAll=status=>{
    MC.forEach((_,i)=>{
      const m=i+1;
      let cur=pays[mb.id]?.[m]??null;
      if(cur===status)return;
      for(let x=0;x<4;x++){
        toggle(mb.id,m);
        const nxt=CICLO[(CICLO.indexOf(cur)+1)%4];
        cur=nxt;
        if(cur===status)break;
      }
    });
  };

  return(
    <div onClick={onClose} style={{
      position:"fixed",inset:0,background:"rgba(44,18,6,0.6)",backdropFilter:"blur(2px)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16,
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:C.surf,borderRadius:12,width:"100%",maxWidth:540,
        overflow:"hidden",boxShadow:`0 20px 60px rgba(44,18,6,0.3)`,
        border:`1px solid ${C.brd2}`,
      }}>
        <Stripe/>
        {/* Header */}
        <div style={{background:`linear-gradient(135deg,${C.siena},${C.verm})`,padding:"20px 24px 16px",textAlign:"center"}}>
          <div style={{fontSize:9,color:"#FFDDBB",letterSpacing:6,textTransform:"uppercase",marginBottom:6}}>
            Bakiso Gunzo · Nação Angola
          </div>
          <div style={{fontSize:24,color:C.branco,letterSpacing:3,fontFamily:"'Cinzel',serif",fontStyle:"italic"}}>
            {mb.dijina}
          </div>
          <div style={{fontSize:13,color:"#FFDDBB",marginTop:3}}>{mb.nome}</div>
          <div style={{display:"flex",justifyContent:"center",gap:24,marginTop:10,fontSize:12}}>
            <span style={{color:"#FFDDBB"}}>Taxa: <strong style={{color:C.branco}}>{fmt(mb.taxa)}/mês</strong></span>
            <span style={{color:"#FFDDBB"}}>Pagos: <strong style={{color:mpg>0?"#90EE90":"#FFB0B0"}}>{mpg}/12</strong></span>
            <span style={{color:"#FFDDBB"}}>Total: <strong style={{color:"#FFE090"}}>{fmt(tot)}</strong></span>
          </div>
        </div>

        <div style={{padding:"18px 22px",background:C.surf2}}>
          <div style={{fontSize:11,color:C.inkFade,textAlign:"center",marginBottom:14,letterSpacing:.4}}>
            Clique no mês para alternar — Em aberto · Individual · Família · Negociado
          </div>
          {/* Grid meses */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
            {MC.map((m,i)=>{
              const st=gp(i+1);
              const fut=i+1>5;
              return(
                <button key={m} onClick={()=>toggle(mb.id,i+1)} style={{
                  background:stBg(st),border:`1px solid ${stBd(st)}`,
                  borderRadius:8,padding:"11px 6px",cursor:"pointer",
                  textAlign:"center",opacity:fut?.75:1,transition:"all .12s",
                }}>
                  <div style={{fontSize:13,color:C.ink,fontWeight:"bold",marginBottom:3}}>{m}</div>
                  <div style={{fontSize:10,color:stFg(st)}}>{st?SLBL[st]:"—"}</div>
                  {st&&<div style={{fontSize:9,color:stFg(st),opacity:.8,marginTop:2}}>R${mb.taxa}</div>}
                  {fut&&!st&&<div style={{fontSize:9,color:C.inkFade,marginTop:2}}>futuro</div>}
                </button>
              );
            })}
          </div>
          {/* Progresso */}
          <div style={{marginTop:16}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.inkFade,marginBottom:5}}>
              <span>Progresso anual</span><span style={{color:C.terra,fontWeight:"bold"}}>{pct}%</span>
            </div>
            <div style={{background:C.bgAlt,borderRadius:4,height:10,overflow:"hidden"}}>
              <div style={{height:"100%",borderRadius:4,transition:"width .4s",
                width:`${Math.min(pct,100)}%`,
                background:`linear-gradient(90deg,${C.verm},${C.terra},${C.ocre},${C.dour})`}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.inkFade,marginTop:4}}>
              <span>{fmt(tot)} pagos</span><span>{fmt(esp-tot)} restantes</span>
            </div>
          </div>
          <Div color={C.ocre}/>
          {/* Ações em massa */}
          <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
            {[
              {l:"✓ Todos Individual",st:"I",bg:C.ok},
              {l:"⌂ Todos Família",   st:"F",bg:C.info},
              {l:"≈ Todos Negociado", st:"N",bg:C.neg},
              {l:"✕ Limpar tudo",     st:null,bg:C.verm},
            ].map(a=>(
              <button key={a.l} onClick={()=>setAll(a.st)} style={{
                background:a.bg+"22",border:`1px solid ${a.bg}66`,color:a.bg,
                borderRadius:5,padding:"5px 10px",cursor:"pointer",fontSize:11,fontWeight:"bold",
              }}>{a.l}</button>
            ))}
            <button onClick={onClose} style={{
              marginLeft:"auto",background:C.dour+"22",border:`1px solid ${C.dour}88`,
              color:C.siena,borderRadius:5,padding:"5px 18px",cursor:"pointer",fontSize:11,fontWeight:"bold",
            }}>Fechar</button>
          </div>
        </div>
        <Stripe/>
      </div>
    </div>
  );
}

function App(){
  const [tab,    setTab]   = useState("painel");
  const [month,  setMonth] = useState(5);
  const [pays,   setPays]  = useState({});
  const [doas,   setDoas]  = useState([]);
  const [saved,  setSaved] = useState(true);
  const [modal,  setModal] = useState(null);
  const [filter, setFilter]= useState("");
  const [sort,   setSort]  = useState("id");
  const [showFm, setShowFm]= useState(false);
  const [form,   setForm]  = useState({nome:"",valor:"",descricao:"",data:"2026-05-11"});
  const importRef = useRef();

  // ── AutoSave localStorage ──
  useEffect(()=>{
    try{const p=localStorage.getItem("bakiso-pag-2026"); if(p)setPays(JSON.parse(p));}catch{}
    try{const d=localStorage.getItem("bakiso-doa-2026"); if(d)setDoas(JSON.parse(d));}catch{}
  },[]);

  useEffect(()=>{
    try{localStorage.setItem("bakiso-pag-2026",JSON.stringify(pays)); setSaved(true);}catch{}
  },[pays]);

  useEffect(()=>{
    try{localStorage.setItem("bakiso-doa-2026",JSON.stringify(doas)); setSaved(true);}catch{}
  },[doas]);

  // ── Helpers ──
  const gp=  (id,m)=>pays[id]?.[m]??null;
  const tog=(id,m)=>{
    setSaved(false);
    const cur=pays[id]?.[m]??null;
    const nxt=CICLO[(CICLO.indexOf(cur)+1)%4];
    setPays(p=>({...p,[id]:{...(p[id]||{}),[m]:nxt}}));
  };

  const stats=m=>{
    let esp=0,ind=0,fam=0,neg=0;
    MEMBERS.forEach(mb=>{
      esp+=mb.taxa;
      const s=gp(mb.id,m);
      if(s==="I")ind+=mb.taxa;
      else if(s==="F")fam+=mb.taxa;
      else if(s==="N")neg+=mb.taxa;
    });
    return{esp,ind,fam,neg,arr:ind+fam+neg,ab:esp-(ind+fam+neg)};
  };

  const TM=MEMBERS.reduce((s,m)=>s+m.taxa,0);
  const st=stats(month);
  const pct=st.esp>0?Math.round((st.arr/st.esp)*100):0;
  const totD=doas.reduce((s,d)=>s+d.valor,0);

  const chartData=MC.map((label,i)=>{
    const s=stats(i+1);
    return{label,arr:s.arr,prev:i+1>month?TM:0,ab:i+1<=month?s.ab:0};
  });

  const sorted=[...MEMBERS]
    .filter(mb=>!filter||mb.dijina.toLowerCase().includes(filter.toLowerCase())||mb.nome.toLowerCase().includes(filter.toLowerCase()))
    .sort((a,b)=>sort==="nome"?a.nome.localeCompare(b.nome):sort==="taxa"?b.taxa-a.taxa:a.id-b.id);

  const addDoa=()=>{
    if(!form.nome||!form.valor)return;
    setDoas(p=>[...p,{...form,id:Date.now(),valor:parseFloat(form.valor)}]);
    setForm({nome:"",valor:"",descricao:"",data:"2026-05-11"});
    setShowFm(false);
  };

  // ── Export Excel ──
  const exportXLS=()=>{
    const wb=XLSX.utils.book_new();
    const h1=["#","DIJINA","NOME","TAXA",...MF,"TOTAL PAGO","TOTAL ESPERADO","SALDO"];
    const r1=MEMBERS.map(mb=>{
      const ms=MF.map((_,i)=>{const s=gp(mb.id,i+1);return s?SLBL[s]:"";});
      const tp=MC.reduce((s,_,i)=>s+(gp(mb.id,i+1)?mb.taxa:0),0);
      return[mb.id,mb.dijina,mb.nome,mb.taxa,...ms,tp,mb.taxa*12,tp-mb.taxa*12];
    });
    const ws1=XLSX.utils.aoa_to_sheet([h1,...r1]);
    ws1["!cols"]=[{wch:4},{wch:20},{wch:22},{wch:8},...MF.map(()=>({wch:12})),{wch:13},{wch:15},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws1,"Mensalidades 2026");

    const h2=["MÊS","ESPERADO","INDIVIDUAL","FAMÍLIA","NEGOCIADO","ARRECADADO","EM ABERTO","ADIMPLÊNCIA"];
    const r2=MF.map((mf,i)=>{const s=stats(i+1);return[mf,s.esp,s.ind,s.fam,s.neg,s.arr,s.ab,`${s.esp>0?Math.round((s.arr/s.esp)*100):0}%`];});
    const ws2=XLSX.utils.aoa_to_sheet([h2,...r2]);
    ws2["!cols"]=[{wch:14},{wch:12},{wch:12},{wch:10},{wch:12},{wch:14},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws2,"Resumo Mensal");

    const h3=["MÊS","EM DIA","EM ABERTO","NOMES — EM DIA"];
    const r3=MF.map((mf,i)=>{
      const ed=MEMBERS.filter(mb=>gp(mb.id,i+1)!==null);
      return[mf,ed.length,69-ed.length,ed.map(mb=>mb.nome).join(", ")];
    });
    const ws3=XLSX.utils.aoa_to_sheet([h3,...r3]);
    ws3["!cols"]=[{wch:14},{wch:10},{wch:12},{wch:90}];
    XLSX.utils.book_append_sheet(wb,ws3,"Situação por Mês");

    if(doas.length>0){
      const h4=["DATA","NOME/DIJINA","VALOR","DESCRIÇÃO"];
      const r4=doas.map(d=>[d.data,d.nome,d.valor,d.descricao||""]);
      const ws4=XLSX.utils.aoa_to_sheet([h4,...r4,["TOTAL","",totD,""]]);
      ws4["!cols"]=[{wch:12},{wch:24},{wch:12},{wch:30}];
      XLSX.utils.book_append_sheet(wb,ws4,"Doações");
    }
    XLSX.writeFile(wb,"Bakiso_Mensalidades_2026.xlsx");
  };

  // ── Export/Import JSON ──
  const exportJSON=()=>{
    const data=JSON.stringify({pays,doas},null,2);
    const blob=new Blob([data],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="bakiso_backup.json";
    a.click();
  };
  const importJSON=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.pays)setPays(d.pays);
        if(d.doas)setDoas(d.doas);
        alert("Dados importados com sucesso!");
      }catch{alert("Arquivo inválido.");}
    };
    r.readAsText(f);
    e.target.value="";
  };

  // ── Estilos ──
  const CARD={background:C.surf,border:`1px solid ${C.brd}`,borderRadius:8,boxShadow:"0 1px 4px rgba(44,18,6,.06)"};
  const INP={background:C.surf2,border:`1px solid ${C.brd2}`,color:C.ink,borderRadius:6,padding:"8px 12px",fontSize:14,outline:"none",width:"100%"};
  const sbtn=(on,bg=C.terra)=>({
    background:on?bg+"22":"transparent",border:`1px solid ${on?bg:C.brd2}`,
    color:on?bg:C.inkFade,borderRadius:5,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:on?"bold":"normal",
  });

  const TABS=[["painel","Painel"],["membros","Membros"],["emdia","Em Dia"],["emaberto","Em Aberto"],["doacoes","Doações"]];

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'Crimson Text',Georgia,serif",color:C.ink}}>

      {modal&&<ModalMembro mb={modal} pays={pays} toggle={tog} onClose={()=>setModal(null)}/>}

      {/* ══ HEADER ══ */}
      <div style={{background:`linear-gradient(135deg,${C.siena},${C.verm} 60%,#5A1010)`,boxShadow:"0 4px 20px rgba(44,18,6,.25)"}}>
        <Stripe/>
        <div style={{padding:"16px 20px 14px",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
          {/* Emblema */}
          <div style={{
            width:54,height:54,borderRadius:"50%",flexShrink:0,
            background:`conic-gradient(${C.verm},${C.siena},${C.terra},${C.ocre},${C.dour},${C.ocre},${C.terra},${C.siena},${C.verm})`,
            border:"3px solid rgba(255,220,120,.5)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:26,boxShadow:"0 0 24px rgba(139,22,22,.6)",
          }}>𓂀</div>

          <div style={{flex:1,minWidth:180}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:16,fontWeight:700,letterSpacing:2.5,color:C.branco,textTransform:"uppercase"}}>
              Bakiso Gunzo Nria Nzazi
            </div>
            <div style={{fontSize:12,color:"rgba(255,220,170,.8)",letterSpacing:1.2,marginTop:2}}>
              Nação Angola · Família Mazambe · Mensalidades 2026
            </div>
          </div>

          {/* Indicador de save */}
          <div style={{fontSize:11,color:saved?"rgba(180,255,180,.8)":"rgba(255,220,120,.8)",transition:"color .3s"}}>
            {saved?"● Salvo":"● Salvando…"}
          </div>

          {/* Botões */}
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={exportXLS} style={{
              background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,220,120,.5)",
              color:C.branco,borderRadius:7,padding:"8px 14px",cursor:"pointer",
              fontSize:12,fontFamily:"'Cinzel',serif",letterSpacing:.5,
              display:"flex",alignItems:"center",gap:6,
            }}>
              <span style={{fontSize:15}}>⬇</span> Excel
            </button>
            <button onClick={exportJSON} style={{
              background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,220,120,.3)",
              color:"rgba(255,220,170,.9)",borderRadius:7,padding:"8px 14px",cursor:"pointer",
              fontSize:12,fontFamily:"'Cinzel',serif",
            }}>↓ Backup</button>
            <button onClick={()=>importRef.current.click()} style={{
              background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,220,120,.3)",
              color:"rgba(255,220,170,.9)",borderRadius:7,padding:"8px 14px",cursor:"pointer",
              fontSize:12,fontFamily:"'Cinzel',serif",
            }}>↑ Importar</button>
            <input ref={importRef} type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>
          </div>
        </div>
        <Stripe/>
      </div>

      {/* ══ SELETOR DE MÊS ══ */}
      <div style={{background:C.bgAlt,borderBottom:`1px solid ${C.brd}`,padding:"10px 20px",overflowX:"auto"}}>
        <div style={{display:"flex",gap:5,minWidth:"max-content"}}>
          {MC.map((m,i)=>{
            const s=stats(i+1);
            const act=month===i+1;
            const fut=i+1>5;
            return(
              <button key={m} onClick={()=>setMonth(i+1)} style={{
                background:act?`linear-gradient(135deg,${C.terra},${C.siena})`:C.surf,
                border:`1px solid ${act?C.terra:C.brd}`,
                color:act?C.branco:C.inkMid,
                borderRadius:6,padding:"6px 10px",cursor:"pointer",
                fontSize:12,minWidth:44,textAlign:"center",
                boxShadow:act?`0 2px 10px ${C.terra}55`:"none",
                opacity:fut?.7:1,transition:"all .15s",
              }}>
                <div style={{fontWeight:act?"bold":"normal"}}>{m}</div>
                <div style={{fontSize:9,marginTop:2,color:act?"rgba(255,230,180,.9)":s.arr>0?C.terra:C.inkFade}}>
                  {s.arr>0?(s.arr/1000).toFixed(1)+"k":fut?"prev.":"—"}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* ══ ABAS ══ */}
      <div style={{background:C.surf,borderBottom:`2px solid ${C.brd}`,padding:"0 20px",display:"flex",overflowX:"auto"}}>
        {TABS.map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{
            background:"transparent",color:tab===k?C.siena:C.inkFade,
            border:"none",borderBottom:`3px solid ${tab===k?C.terra:"transparent"}`,
            padding:"11px 16px",cursor:"pointer",fontSize:13,
            fontFamily:"'Cinzel',serif",letterSpacing:.5,whiteSpace:"nowrap",
            transition:"color .15s",
          }}>{l}</button>
        ))}
      </div>

      {/* ══ CONTEÚDO ══ */}
      <div style={{padding:"20px",maxWidth:1100,margin:"0 auto"}}>

        {/* ──── PAINEL ──── */}
        {tab==="painel"&&(
          <div>
            <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:18}}>
              <span style={{fontFamily:"'Cinzel',serif",fontSize:22,color:C.siena}}>{MF[month-1]}</span>
              <span style={{color:C.inkFade,fontSize:14}}>2026</span>
              {month>5&&<span style={{fontSize:11,background:C.ocre+"22",color:C.ocre,border:`1px solid ${C.ocre}66`,borderRadius:4,padding:"2px 10px"}}>Previsão</span>}
            </div>

            {/* Cards */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(148px,1fr))",gap:10,marginBottom:18}}>
              {[
                {l:"Receita esperada",v:fmt(st.esp),  c:C.inkMid},
                {l:"Arrecadado",      v:fmt(st.arr),  c:C.ok},
                {l:"Em aberto",       v:fmt(st.ab),   c:st.ab>0?C.terra:C.ok},
                {l:"Adimplência",     v:`${pct}%`,    c:pct>=80?C.ok:pct>=50?C.ocre:C.terra},
                {l:"Individual",      v:fmt(st.ind),  c:C.stIFg},
                {l:"Família",         v:fmt(st.fam),  c:C.stFFg},
                {l:"Negociado",       v:fmt(st.neg),  c:C.stNFg},
                {l:"Doações",         v:fmt(totD),    c:C.dour},
              ].map(c=>(
                <div key={c.l} style={{...CARD,padding:"13px 16px",textAlign:"center"}}>
                  <div style={{fontSize:10,color:C.inkFade,letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>{c.l}</div>
                  <div style={{fontSize:19,fontWeight:"bold",color:c.c,fontFamily:"'Cinzel',serif"}}>{c.v}</div>
                </div>
              ))}
            </div>

            {/* Barra progresso */}
            <div style={{...CARD,padding:"15px 20px",marginBottom:14,borderLeft:`4px solid ${C.terra}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:12}}>
                <span style={{fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:1,color:C.siena}}>PROGRESSO — {MF[month-1].toUpperCase()}</span>
                <span style={{color:C.terra,fontWeight:"bold",fontSize:15}}>{pct}%</span>
              </div>
              <div style={{background:C.bgAlt,borderRadius:5,height:14,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:5,transition:"width .5s",
                  width:`${Math.min(pct,100)}%`,
                  background:`linear-gradient(90deg,${C.verm},${C.siena},${C.terra},${C.ocre},${C.dour})`}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:7,fontSize:11,color:C.inkFade}}>
                <span><strong style={{color:C.ok}}>{fmt(st.arr)}</strong> · {MEMBERS.filter(mb=>gp(mb.id,month)!==null).length} em dia</span>
                <span><strong style={{color:C.terra}}>{fmt(st.ab)}</strong> · {MEMBERS.filter(mb=>gp(mb.id,month)===null).length} em aberto</span>
              </div>
            </div>

            {/* Gráfico */}
            <div style={{...CARD,padding:"16px 20px",marginBottom:14}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.inkFade,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>
                Arrecadação Anual — 2026
              </div>
              <BarChart data={chartData} activeMonth={month}/>
              <div style={{display:"flex",gap:18,fontSize:11,color:C.inkFade,marginTop:8}}>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{display:"inline-block",width:10,height:10,background:C.terra,borderRadius:2}}></span> Arrecadado</span>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{display:"inline-block",width:10,height:10,background:C.ocre+"55",borderRadius:2}}></span> Previsão</span>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{display:"inline-block",width:10,height:10,background:C.terra+"55",borderRadius:2}}></span> Em aberto</span>
              </div>
            </div>

            {/* Acumulado */}
            <div style={{...CARD,padding:"15px 20px"}}>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.inkFade,letterSpacing:1.5,textTransform:"uppercase",marginBottom:14}}>Acumulado Anual</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
                {(()=>{let ar=0,es=0;for(let m=1;m<=month;m++){const s=stats(m);ar+=s.arr;es+=s.esp;}
                  return[
                    {l:"Real arrecadado",   v:fmt(ar),        c:C.ok},
                    {l:"Esperado no período",v:fmt(es),       c:C.inkMid},
                    {l:"Projeção anual",    v:fmt(TM*12),     c:C.siena},
                  ].map(c=>(
                    <div key={c.l} style={{textAlign:"center",padding:"12px",background:C.surf2,borderRadius:8}}>
                      <div style={{fontSize:10,color:C.inkFade,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{c.l}</div>
                      <div style={{fontSize:17,color:c.c,fontWeight:"bold",fontFamily:"'Cinzel',serif"}}>{c.v}</div>
                    </div>
                  ));
                })()}
              </div>
            </div>
          </div>
        )}

        {/* ──── MEMBROS ──── */}
        {tab==="membros"&&(
          <div>
            <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
              <input placeholder="Buscar dijina ou nome…" value={filter} onChange={e=>setFilter(e.target.value)} style={{...INP,flex:1,minWidth:160}}/>
              <div style={{display:"flex",gap:5}}>
                {[["id","#"],["nome","Nome"],["taxa","Taxa"]].map(([f,l])=>(
                  <button key={f} onClick={()=>setSort(f)} style={sbtn(sort===f)}>{l}</button>
                ))}
              </div>
            </div>
            <div style={{fontSize:11,color:C.inkFade,marginBottom:10,padding:"7px 12px",background:C.surf2,borderRadius:6,border:`1px solid ${C.brd}`,lineHeight:1.7}}>
              ◆ Clique na <strong style={{color:C.terra}}>dijina</strong> para registrar vários meses de uma vez.
              &ensp;·&ensp; Clique no <strong style={{color:C.ink}}>pill de status</strong> para alternar só <strong style={{color:C.siena}}>{MC[month-1]}</strong>.
              &ensp;·&ensp; <span style={{color:C.terra}}>(n/12)</span> = meses pagos no ano.
            </div>
            <div style={{...CARD,padding:0,overflow:"hidden"}}>
              <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",fontSize:13,minWidth:500}}>
                <thead>
                  <tr style={{background:C.bgAlt,borderBottom:`2px solid ${C.brd2}`}}>
                    {["#","DIJINA","NOME","TAXA","STATUS — "+MC[month-1]].map(h=>(
                      <th key={h} style={{padding:"10px 14px",textAlign:"left",color:C.siena,fontSize:10,
                        fontWeight:"normal",letterSpacing:1.5,fontFamily:"'Cinzel',serif",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((mb,i)=>{
                    const s=gp(mb.id,month);
                    const mp=MC.filter((_,j)=>gp(mb.id,j+1)!==null).length;
                    return(
                      <tr key={mb.id} style={{borderBottom:`1px solid ${C.brd}`,background:i%2===0?C.surf:C.surf2}}>
                        <td style={{padding:"9px 14px",color:C.inkFade,fontSize:11}}>{mb.id}</td>
                        <td style={{padding:"9px 14px"}}>
                          <button onClick={()=>setModal(mb)} style={{
                            background:"transparent",border:"none",padding:0,cursor:"pointer",
                            color:C.siena,fontStyle:"italic",fontFamily:"inherit",fontSize:14,textAlign:"left",
                          }}>
                            {mb.dijina}
                            {mp>0&&<span style={{fontSize:10,color:C.terra,marginLeft:6,fontStyle:"normal",
                              background:C.terra+"18",borderRadius:3,padding:"1px 5px"}}>
                              {mp}/12
                            </span>}
                          </button>
                        </td>
                        <td style={{padding:"9px 14px",color:C.ink}}>{mb.nome}</td>
                        <td style={{padding:"9px 14px",color:C.inkFade,textAlign:"center"}}>R${mb.taxa}</td>
                        <td style={{padding:"9px 14px"}}><Pill st={s} onClick={()=>tog(mb.id,month)}/></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              </div>
            </div>
          </div>
        )}

        {/* ──── EM DIA ──── */}
        {tab==="emdia"&&(()=>{
          const lista=MEMBERS.filter(mb=>gp(mb.id,month)!==null);
          return(
            <div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:C.siena,marginBottom:16,letterSpacing:1}}>
                ADIMPLENTES — {MF[month-1].toUpperCase()} 2026
              </div>
              {lista.length===0
                ?<div style={{...CARD,padding:36,textAlign:"center",color:C.inkFade}}>Nenhum pagamento registrado para {MF[month-1]}.</div>
                :<div>
                  <div style={{...CARD,padding:"15px 20px",marginBottom:14,display:"flex",gap:32,borderLeft:`4px solid ${C.ok}`}}>
                    <div><div style={{fontSize:10,color:C.inkFade,textTransform:"uppercase",letterSpacing:1}}>Em dia</div>
                      <div style={{fontSize:26,color:C.ok,fontFamily:"'Cinzel',serif"}}>{lista.length}</div></div>
                    <div><div style={{fontSize:10,color:C.inkFade,textTransform:"uppercase",letterSpacing:1}}>Recolhido</div>
                      <div style={{fontSize:26,color:C.siena,fontFamily:"'Cinzel',serif"}}>{fmt(lista.reduce((s,mb)=>s+mb.taxa,0))}</div></div>
                  </div>
                  <Div/>
                  <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>
                    {lista.map(mb=>(
                      <div key={mb.id} onClick={()=>setModal(mb)} style={{...CARD,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 16px",cursor:"pointer"}}>
                        <div>
                          <span style={{color:C.siena,fontStyle:"italic",marginRight:10,fontSize:14}}>{mb.dijina}</span>
                          <span style={{color:C.ink}}>{mb.nome}</span>
                        </div>
                        <div style={{display:"flex",gap:10,alignItems:"center"}}>
                          <span style={{color:C.inkFade,fontSize:12}}>R${mb.taxa}</span>
                          <Pill st={gp(mb.id,month)}/>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              }
            </div>
          );
        })()}

        {/* ──── EM ABERTO ──── */}
        {tab==="emaberto"&&(()=>{
          const lista=MEMBERS.filter(mb=>gp(mb.id,month)===null);
          return(
            <div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:C.siena,marginBottom:16,letterSpacing:1}}>
                PENDÊNCIAS — {MF[month-1].toUpperCase()} 2026
              </div>
              <div style={{...CARD,padding:"15px 20px",marginBottom:14,display:"flex",gap:32,borderLeft:`4px solid ${C.terra}`}}>
                <div><div style={{fontSize:10,color:C.inkFade,textTransform:"uppercase",letterSpacing:1}}>Em aberto</div>
                  <div style={{fontSize:26,color:C.terra,fontFamily:"'Cinzel',serif"}}>{lista.length}</div></div>
                <div><div style={{fontSize:10,color:C.inkFade,textTransform:"uppercase",letterSpacing:1}}>Valor pendente</div>
                  <div style={{fontSize:26,color:C.terra,fontFamily:"'Cinzel',serif"}}>{fmt(lista.reduce((s,mb)=>s+mb.taxa,0))}</div></div>
              </div>
              <Div color={C.terra}/>
              <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>
                {lista.map(mb=>(
                  <div key={mb.id} onClick={()=>setModal(mb)} style={{...CARD,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 16px",cursor:"pointer"}}>
                    <div>
                      <span style={{color:C.siena,fontStyle:"italic",marginRight:10,fontSize:14}}>{mb.dijina}</span>
                      <span style={{color:C.ink}}>{mb.nome}</span>
                    </div>
                    <div style={{display:"flex",gap:10,alignItems:"center"}}>
                      <span style={{color:C.inkFade,fontSize:12}}>R${mb.taxa}</span>
                      <span style={{fontSize:11,color:C.terra,fontWeight:"bold"}}>↗ registrar</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}

        {/* ──── DOAÇÕES ──── */}
        {tab==="doacoes"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:10}}>
              <div>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:C.siena,letterSpacing:1}}>DOAÇÕES E CONTRIBUIÇÕES EXTRAS</div>
                <div style={{color:C.siena,fontSize:22,marginTop:4,fontFamily:"'Cinzel',serif",fontWeight:"bold"}}>{fmt(totD)}</div>
              </div>
              <button onClick={()=>setShowFm(f=>!f)} style={{
                background:showFm?C.verm+"22":`${C.terra}22`,
                border:`2px solid ${showFm?C.verm:C.terra}`,
                color:showFm?C.verm:C.siena,borderRadius:7,padding:"9px 20px",cursor:"pointer",
                fontFamily:"'Cinzel',serif",fontSize:12,letterSpacing:.5,fontWeight:"bold",
              }}>
                {showFm?"✕ Cancelar":"+ Registrar doação"}
              </button>
            </div>

            {showFm&&(
              <div style={{...CARD,padding:"18px 22px",marginBottom:18,borderLeft:`4px solid ${C.ocre}`}}>
                <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:C.siena,marginBottom:14,letterSpacing:1}}>NOVA DOAÇÃO</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
                  {[
                    {l:"Nome / Dijina",k:"nome",     t:"text",  p:"Quem contribuiu"},
                    {l:"Valor (R$)",  k:"valor",    t:"number",p:"0,00"},
                    {l:"Data",        k:"data",     t:"date",  p:""},
                    {l:"Descrição",   k:"descricao",t:"text",  p:"Finalidade (opcional)"},
                  ].map(f=>(
                    <div key={f.k}>
                      <div style={{fontSize:10,color:C.inkFade,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{f.l}</div>
                      <input type={f.t} placeholder={f.p} value={form[f.k]}
                        onChange={e=>setForm(p=>({...p,[f.k]:e.target.value}))} style={INP}/>
                    </div>
                  ))}
                </div>
                <div style={{marginTop:14,display:"flex",gap:8}}>
                  <button onClick={addDoa} style={{
                    background:C.ok+"22",border:`2px solid ${C.ok}`,color:C.ok,
                    borderRadius:6,padding:"8px 22px",cursor:"pointer",
                    fontFamily:"'Cinzel',serif",fontSize:12,letterSpacing:.5,fontWeight:"bold",
                  }}>Salvar</button>
                  <button onClick={()=>setShowFm(false)} style={sbtn(false)}>Cancelar</button>
                </div>
              </div>
            )}

            {doas.length===0
              ?<div style={{...CARD,padding:36,textAlign:"center",color:C.inkFade}}>Nenhuma doação registrada ainda.</div>
              :<div style={{display:"flex",flexDirection:"column",gap:8}}>
                {[...doas].reverse().map(d=>(
                  <div key={d.id} style={{...CARD,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px"}}>
                    <div>
                      <div style={{color:C.ink,fontSize:15}}>{d.nome}</div>
                      {d.descricao&&<div style={{fontSize:12,color:C.inkFade,marginTop:2}}>{d.descricao}</div>}
                      <div style={{fontSize:11,color:C.inkFade,marginTop:3}}>{d.data}</div>
                    </div>
                    <div style={{fontSize:22,color:C.siena,fontFamily:"'Cinzel',serif",fontWeight:"bold"}}>{fmt(d.valor)}</div>
                  </div>
                ))}
              </div>
            }
          </div>
        )}

      </div>

      {/* ══ RODAPÉ ══ */}
      <div style={{marginTop:32}}>
        <Stripe/>
        <div style={{textAlign:"center",padding:"14px 20px",fontSize:11,color:C.inkFade,fontFamily:"'Cinzel',serif",letterSpacing:2,background:C.bgAlt}}>
          BAKISO GUNZO NRIA NZAZI · NAÇÃO ANGOLA · FAMÍLIA MAZAMBE · 2026
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
